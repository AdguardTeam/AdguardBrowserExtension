name: Auto build

# Every 12 hours (00:30 and 12:30 UTC): updates @adguard/dnr-rulesets and
# local resources on the stable branch, rebuilds Chrome MV3 beta + release,
# and auto-publishes them to the Chrome Web Store when the store reports the
# channel as available. Replaces Bamboo plans auto-build + auto-publish.
#
# Note: the schedule trigger runs the workflow file from the DEFAULT branch
# (master); all jobs explicitly check out the stable branch.

on:
  schedule:
    - cron: '30 */12 * * *'
  workflow_dispatch:

# A manual workflow_dispatch during a scheduled run must not execute
# concurrently with it: both would push commits to the stable branch.
concurrency:
  group: auto-build-${{ github.repository }}
  cancel-in-progress: true

env:
  STABLE_BRANCH: stable/v5.5

jobs:
  check-cws:
    name: Check CWS availability
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # Vault JWT/OIDC
    outputs:
      beta-available: ${{ steps.props.outputs.beta-available }}
      release-available: ${{ steps.props.outputs.release-available }}
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.STABLE_BRANCH }}

      - name: Fetch Chrome Web Store credentials from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          path: jwt
          role: chrome-webstore-deployer
          secrets: |
            secret/data/ci-secrets/chrome-webstore-deployer client-id | CHROME_CLIENT_ID ;
            secret/data/ci-secrets/chrome-webstore-deployer client-secret | CHROME_CLIENT_SECRET ;
            secret/data/ci-secrets/chrome-webstore-deployer refresh-token | CHROME_REFRESH_TOKEN ;
            secret/data/ci-secrets/chrome-webstore-deployer publisher-id | CHROME_PUBLISHER_ID ;

      - name: Check store status via Docker
        env:
          CHROME_CLIENT_ID: ${{ steps.vault.outputs.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ steps.vault.outputs.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ steps.vault.outputs.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ steps.vault.outputs.CHROME_PUBLISHER_ID }}
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --build-arg CWS_BETA_ITEM_ID="${{ vars.CHROME_WEBSTORE_MV3_BETA_ITEM_ID || 'apjcbfpjihpedihablmalmbbhjpklbdf' }}" \
            --build-arg CWS_RELEASE_ITEM_ID="${{ vars.CHROME_WEBSTORE_MV3_ITEM_ID || 'bgnkhhnnamicmpeenaelnjfhikgbkllg' }}" \
            --secret id=CHROME_CLIENT_ID,env=CHROME_CLIENT_ID \
            --secret id=CHROME_PUBLISHER_ID,env=CHROME_PUBLISHER_ID \
            --secret id=CHROME_CLIENT_SECRET,env=CHROME_CLIENT_SECRET \
            --secret id=CHROME_REFRESH_TOKEN,env=CHROME_REFRESH_TOKEN \
            --target check-cws-output \
            --output type=local,dest=output/check-cws .

      - name: Read availability properties
        id: props
        run: |
          set -euo pipefail
          props=output/check-cws/artifacts/cws-availability.properties
          beta="$(grep '^betaChannelAvailable=' "${props}" | cut -d= -f2)"
          release="$(grep '^releaseChannelAvailable=' "${props}" | cut -d= -f2)"
          [ -n "${beta}" ] || { echo "::error::betaChannelAvailable missing in ${props}"; exit 1; }
          [ -n "${release}" ] || { echo "::error::releaseChannelAvailable missing in ${props}"; exit 1; }
          echo "beta-available=${beta}" >> "$GITHUB_OUTPUT"
          echo "release-available=${release}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and locales check
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.STABLE_BRANCH }}

      - name: Create empty tsurlfilter build context
        run: mkdir -p tmp/tsurlfilter

      - name: Run lint via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-context tsurlfilter=tmp/tsurlfilter \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target lint-output \
            --output type=local,dest=output/lint .

      - name: Validate locales via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-context tsurlfilter=tmp/tsurlfilter \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target locales-check-output \
            --output type=local,dest=output/locales .

  unit-tests:
    name: Unit tests
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.STABLE_BRANCH }}

      - name: Create empty tsurlfilter build context
        run: mkdir -p tmp/tsurlfilter

      - name: Run unit tests via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-context tsurlfilter=tmp/tsurlfilter \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target unit-tests-output \
            --output type=local,dest=output/unit-tests .

      - name: Upload unit tests report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-build-unit-tests-report
          path: output/unit-tests/tests-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check unit tests exit code
        shell: bash
        run: bash tools/ci/check-exit-code.sh output/unit-tests/exit-code.txt "Unit tests"

  update-filters-and-build:
    name: Update filters and build
    needs: [check-cws, lint, unit-tests]
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read    # checkout + fetch of the stable branch only (commit push is via protected-push/Octopass)
      id-token: write   # Vault JWT/OIDC + Octopass OIDC for protected-push
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.STABLE_BRANCH }}

      - name: Create empty tsurlfilter build context
        run: mkdir -p tmp/tsurlfilter

      - name: Fetch TokenGuard API key from Vault
        id: vault-tokenguard
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          path: jwt
          role: extensions-private-browser-extension
          secrets: |
            secret/data/ci-secrets/extensions-private-browser-extension tokenguard_api_key | TOKENGUARD_API_KEY ;

      - name: Generate find excludes
        run: ./tools/ci/generate-find-excludes.sh gitignore-excludes.txt

      # npm throttles the shared CI egress IPs, so the dnr-rulesets update
      # fetches the package tarball from the internal Artifact Keeper npm
      # registry instead (see tools/resources/update-dnr-rulesets.ts). Fail
      # loudly when the org
      # variable is not visible to this repo instead of silently falling back
      # to the throttled npm path.
      - name: Resolve Artifact Keeper npm registry
        env:
          ARTIFACT_KEEPER_URL: ${{ vars.ARTIFACT_KEEPER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACT_KEEPER_URL}" ]; then
            echo "::error::vars.ARTIFACT_KEEPER_URL is not visible to browser-extension; ask infra to grant the org variable to this repository"
            exit 1
          fi
          echo "DNR_RULESETS_REGISTRY=${ARTIFACT_KEEPER_URL}/npm/npm-internal" >> "$GITHUB_ENV"

      # The skip-review flag (full resources update on Tuesdays, skip-review
      # eligibility check otherwise) is computed inside the Dockerfile stage.
      # TOKENGUARD_BASE_URL/TOKENGUARD_MODEL are passed explicitly (production
      # defaults below, overridable via repository variables) so the
      # dangerous-rules check never silently falls back to a hardcoded default;
      # the Dockerfile fails fast if they are missing.
      - name: Update filters, increment version and build via Docker
        env:
          TOKENGUARD_API_KEY: ${{ steps.vault-tokenguard.outputs.TOKENGUARD_API_KEY }}
          TOKENGUARD_BASE_URL: ${{ vars.TOKENGUARD_BASE_URL || 'https://tokenguard.int.agrd.dev/api/v1/' }}
          TOKENGUARD_MODEL: ${{ vars.TOKENGUARD_MODEL || 'deepseek-v4-flash' }}
          BETA_CHANNEL_AVAILABLE: ${{ needs.check-cws.outputs.beta-available }}
          RELEASE_CHANNEL_AVAILABLE: ${{ needs.check-cws.outputs.release-available }}
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-context tsurlfilter=tmp/tsurlfilter \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --build-arg BETA_CHANNEL_AVAILABLE="${BETA_CHANNEL_AVAILABLE}" \
            --build-arg RELEASE_CHANNEL_AVAILABLE="${RELEASE_CHANNEL_AVAILABLE}" \
            --build-arg DNR_RULESETS_REGISTRY="${DNR_RULESETS_REGISTRY}" \
            --build-arg TOKENGUARD_BASE_URL="${TOKENGUARD_BASE_URL}" \
            --build-arg TOKENGUARD_MODEL="${TOKENGUARD_MODEL}" \
            --secret id=TOKENGUARD_API_KEY,env=TOKENGUARD_API_KEY \
            --target auto-build-output \
            --output type=local,dest=output/auto-build .

      # Copy the modified resources/version files from the auto-build stage
      # into the worktree and compute the exact file list to hand to
      # protected-push. The commit + push is done by the company-shared action
      # (Octopass token + --force-with-lease) instead of a hand-rolled
      # `git config user.name/email` + `git push` with the workflow GITHUB_TOKEN.
      # First sync to the latest remote head of the stable branch so the push
      # is a fast-forward and never clobbers a concurrent commit (e.g. an
      # "Update stable branch" merge) that landed while this job was building;
      # build outputs live under output/ and are unaffected by the reset.
      # Note: protected-push authors the commit as github-actions[bot], the
      # shared action's fixed identity, instead of the release-bot persona.
      - name: Prepare auto-build commit
        id: commit
        run: |
          set -euo pipefail
          git fetch origin "${STABLE_BRANCH}"
          git reset --hard "origin/${STABLE_BRANCH}"
          cp -R output/auto-build/modified/. .
          if [ -z "$(git status --porcelain)" ]; then
            echo "No resource changes to commit"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # protected-push stages and commits exactly this (tracked + untracked)
          # file set; names here are safe to space-separate.
          files="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | tr '\n' ' ' )"
          [ -n "${files}" ]
          # The built version goes into the commit message (it used to live in
          # the autobuild-v* tag name, which is no longer created).
          version="$(grep '^version=' output/auto-build/artifacts/build.txt | cut -d= -f2)"
          echo "has-changes=true" >> "$GITHUB_OUTPUT"
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit and push to the stable branch
        if: steps.commit.outputs.has-changes == 'true'
        uses: AdGuardSoftwareLimited/actions/actions/protected-push@master
        with:
          branch: ${{ env.STABLE_BRANCH }}
          commit-message: '[skip ci] Rulesets update & increment patch version (autobuild-v${{ steps.commit.outputs.version }})'
          files: ${{ steps.commit.outputs.files }}

      # Resolve the built version for the CWS publish jobs (version-title).
      # The autobuild-v* tags are intentionally NOT created in the new GitHub
      # CI anymore; nothing consumes them.
      - name: Resolve build version
        id: version
        run: |
          set -euo pipefail
          version="$(grep '^version=' output/auto-build/artifacts/build.txt | cut -d= -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: auto-build-artifacts
          path: output/auto-build/artifacts/
          if-no-files-found: error
          retention-days: 7

      # The CWS workflows expect the extension archive to be named chrome.zip.
      - name: Stage CWS artifacts
        run: |
          set -euo pipefail
          mkdir -p staged/cws-auto-beta staged/cws-auto-release
          cp output/auto-build/artifacts/chrome-mv3-beta.zip staged/cws-auto-beta/chrome.zip
          cp output/auto-build/artifacts/chrome-mv3-release.zip staged/cws-auto-release/chrome.zip

      - name: Upload CWS beta artifact
        uses: actions/upload-artifact@v7
        with:
          name: cws-auto-beta
          path: staged/cws-auto-beta/
          if-no-files-found: error
          retention-days: 7

      - name: Upload CWS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: cws-auto-release
          path: staged/cws-auto-release/
          if-no-files-found: error
          retention-days: 7

  integration-tests:
    name: Integration tests
    needs: update-filters-and-build
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.STABLE_BRANCH }}

      - name: Create empty tsurlfilter build context
        run: mkdir -p tmp/tsurlfilter

      # The Docker stage reads artifacts/chrome-mv3-<BUILD_TYPE>.zip from the
      # `chrome-artifacts` named build context, so the ever-changing zips never
      # re-hash the default build context (which would invalidate the
      # playwright layer every run).
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: auto-build-artifacts
          path: artifacts

      - name: Run integration tests (release)
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-context tsurlfilter=tmp/tsurlfilter \
            --build-context chrome-artifacts=artifacts \
            --build-arg BUILD_TYPE=release \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --no-cache-filter=integration-tests \
            --target integration-tests-output \
            --output type=local,dest=output/integration-release .

      - name: Run integration tests (beta)
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-context tsurlfilter=tmp/tsurlfilter \
            --build-context chrome-artifacts=artifacts \
            --build-arg BUILD_TYPE=beta \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --no-cache-filter=integration-tests \
            --target integration-tests-output \
            --output type=local,dest=output/integration-beta .

      - name: Check integration tests exit codes
        shell: bash
        run: |
          for type in release beta; do
            bash tools/ci/check-exit-code.sh "output/integration-${type}/exit-code.txt" "Integration tests (${type})"
          done

      - name: Upload integration tests report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-build-integration-tests-report
          path: |
            output/integration-release/tests-reports/
            output/integration-beta/tests-reports/
          if-no-files-found: ignore
          retention-days: 7

  publish-cws-beta:
    name: Auto-publish MV3 beta to CWS (expedited)
    needs: [check-cws, update-filters-and-build, integration-tests]
    if: needs.check-cws.outputs.beta-available == 'true'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-chrome-web-store.yml@master
    with:
      team: extensions
      environment: chrome-webstore-beta-auto
      artifact-name: cws-auto-beta
      item-id: ${{ vars.CHROME_WEBSTORE_MV3_BETA_ITEM_ID || 'apjcbfpjihpedihablmalmbbhjpklbdf' }}
      api-version: v2
      expedited: true
      slack-channel: ''
      product: AdGuard Browser Extension MV3 Beta
      version-title: ${{ needs.update-filters-and-build.outputs.version }}
    permissions:
      contents: read
      id-token: write

  # NOTE: the non-expedited fallback only helps if the expedited run failed at
  # the upload/update stage. If the expedited run failed AFTER a successful
  # `go-webext update` (i.e. the store already holds this version), re-running
  # here may be rejected by the store as a duplicate-version upload; in that
  # case a manual publish from the CWS dashboard is required.
  publish-cws-beta-fallback:
    name: Auto-publish MV3 beta to CWS (non-expedited fallback)
    needs: [check-cws, update-filters-and-build, publish-cws-beta]
    if: >-
      always() &&
      needs.check-cws.outputs.beta-available == 'true' &&
      (needs.publish-cws-beta.result == 'failure' || needs.publish-cws-beta.result == 'cancelled')
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-chrome-web-store.yml@master
    with:
      team: extensions
      environment: chrome-webstore-beta-auto
      artifact-name: cws-auto-beta
      item-id: ${{ vars.CHROME_WEBSTORE_MV3_BETA_ITEM_ID || 'apjcbfpjihpedihablmalmbbhjpklbdf' }}
      api-version: v2
      expedited: false
      slack-channel: ''
      product: AdGuard Browser Extension MV3 Beta
      version-title: ${{ needs.update-filters-and-build.outputs.version }}
    permissions:
      contents: read
      id-token: write

  publish-cws-release:
    name: Auto-publish MV3 release to CWS (expedited)
    needs: [check-cws, update-filters-and-build, integration-tests]
    if: needs.check-cws.outputs.release-available == 'true'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-chrome-web-store.yml@master
    with:
      team: extensions
      environment: chrome-webstore-release-auto
      artifact-name: cws-auto-release
      item-id: ${{ vars.CHROME_WEBSTORE_MV3_ITEM_ID || 'bgnkhhnnamicmpeenaelnjfhikgbkllg' }}
      api-version: v2
      expedited: true
      slack-channel: ''
      product: AdGuard Browser Extension MV3
      version-title: ${{ needs.update-filters-and-build.outputs.version }}
    permissions:
      contents: read
      id-token: write

  publish-cws-release-fallback:
    name: Auto-publish MV3 release to CWS (non-expedited fallback)
    needs: [check-cws, update-filters-and-build, publish-cws-release]
    if: >-
      always() &&
      needs.check-cws.outputs.release-available == 'true' &&
      (needs.publish-cws-release.result == 'failure' || needs.publish-cws-release.result == 'cancelled')
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-chrome-web-store.yml@master
    with:
      team: extensions
      environment: chrome-webstore-release-auto
      artifact-name: cws-auto-release
      item-id: ${{ vars.CHROME_WEBSTORE_MV3_ITEM_ID || 'bgnkhhnnamicmpeenaelnjfhikgbkllg' }}
      api-version: v2
      expedited: false
      slack-channel: ''
      product: AdGuard Browser Extension MV3
      version-title: ${{ needs.update-filters-and-build.outputs.version }}
    permissions:
      contents: read
      id-token: write

  notify-failure:
    name: Notify (failure)
    needs: [check-cws, lint, unit-tests, update-filters-and-build, integration-tests, publish-cws-beta, publish-cws-beta-fallback, publish-cws-release, publish-cws-release-fallback]
    # Compact form so adding/removing a job only requires editing `needs`.
    # Cancellation is reported too (a cancelled auto-build is never silent).
    if: >-
      always() &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: team-extensions
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: '#adguard-extension-vcs'
          message: ':cross-mark: *browser-extension* auto-build failed (check-cws: ${{ needs.check-cws.result }}, lint: ${{ needs.lint.result }}, unit: ${{ needs.unit-tests.result }}, build: ${{ needs.update-filters-and-build.result }}, integration: ${{ needs.integration-tests.result }}, cws-beta: ${{ needs.publish-cws-beta.result }}, cws-beta-fallback: ${{ needs.publish-cws-beta-fallback.result }}, cws-release: ${{ needs.publish-cws-release.result }}, cws-release-fallback: ${{ needs.publish-cws-release-fallback.result }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>'
          color: danger
