name: CI

# Lints, unit-tests, and builds the extension on pull requests and pushes to
# master. Uploads installable dev builds as artifacts so QA can download them
# from any PR.

on:
  pull_request:
  push:
    branches:
      - master

# Cancel superseded runs of the same workflow/ref so the shared self-hosted
# runner is never tied up by stale in-flight builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: team-extensions
    # 30m: this job does two Docker builds (lint + locales) plus actionlint, and
    # the builds stall on the shared runner when several PRs run CI at once —
    # a 10m/15m cap cancelled the job (=> whole CI run "cancelled" => gate red).
    timeout-minutes: 30
    # Least privilege — this job never writes to repo contents.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # When tsurlfilter-dev-pr.txt on this branch names a tsurlfilter PR,
      # pin its Artifact Keeper dev builds so the whole pipeline (lint,
      # tests, builds) runs against them. No-op otherwise.
      - name: Pin tsurlfilter dev builds (if configured)
        uses: ./.github/actions/pin-tsurlfilter-dev

      # The lint stage fails the docker build directly on lint errors.
      - name: Run lint via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target lint-output \
            --output type=local,dest=output/lint .

      # Validates translation files (locales-check stage fails on invalid
      # translations). Mirrors the old Bamboo "Size and locales check".
      - name: Validate locales via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target locales-check-output \
            --output type=local,dest=output/locales .

      # Validates the workflow files themselves — unknown runner labels, invalid
      # `if:` expressions and shellcheck warnings inside `run:` blocks would
      # otherwise only surface as a failed run. Self-hosted runner label config
      # lives in .github/actionlint.yaml.
      #
      # The version is pinned and the downloaded archive is verified against
      # the SHA-256 published on the release before anything is executed, so
      # the shared self-hosted runner never runs an unverified binary.
      - name: Run actionlint on workflows
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.12"
          case "$(uname -s)" in
            Linux)                     OS="linux" ;;
            Darwin)                    OS="darwin" ;;
            *) echo "Unsupported OS for actionlint" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64 | amd64)  ARCH="amd64" ;;
            arm64 | aarch64) ARCH="arm64" ;;
            *)               echo "Unsupported arch for actionlint" >&2; exit 1 ;;
          esac

          DL="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_${OS}_${ARCH}.tar.gz"
          curl -sSfL -o "${DL}/${ARCHIVE}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          curl -sSfL -o "${DL}/actionlint_checksums.txt" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"

          EXPECTED="$(awk -v a="${ARCHIVE}" '$2 == a {print $1}' "${DL}/actionlint_checksums.txt")"
          if [ -z "${EXPECTED}" ]; then
            echo "No published checksum for ${ARCHIVE}" >&2
            exit 1
          fi
          case "$(uname -s)" in
            Darwin) ACTUAL="$(shasum -a 256 "${DL}/${ARCHIVE}" | awk '{print $1}')" ;;
            *)      ACTUAL="$(sha256sum "${DL}/${ARCHIVE}" | awk '{print $1}')" ;;
          esac
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "actionlint checksum mismatch (expected ${EXPECTED}, got ${ACTUAL})" >&2
            exit 1
          fi

          tar -xzf "${DL}/${ARCHIVE}" -C "${DL}"
          "${DL}/actionlint" -version
          "${DL}/actionlint" .github/workflows/*.yml

      # actionlint cannot parse action.yml files (it treats them as workflows
      # and errors), so the pin action keeps its logic in a plain Node script
      # (pin.mjs) which we syntax-check here.
      - name: Syntax check composite action scripts
        run: |
          set -euo pipefail
          node --check .github/actions/pin-tsurlfilter-dev/pin.mjs

  unit-tests:
    name: Unit tests
    runs-on: team-extensions
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pin tsurlfilter dev builds (if configured)
        uses: ./.github/actions/pin-tsurlfilter-dev

      # The Docker stage always exits 0 and reports the result via
      # exit-code.txt so the JUnit report is available even on failure.
      - name: Run unit tests via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target unit-tests-output \
            --output type=local,dest=output/unit-tests .

      - name: Upload unit tests report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-report
          path: output/unit-tests/tests-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check unit tests exit code
        shell: bash
        run: bash tools/ci/check-exit-code.sh output/unit-tests/exit-code.txt "Unit tests"

  dev-build:
    name: Dev build (QA artifacts)
    runs-on: team-extensions
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pin tsurlfilter dev builds (if configured)
        uses: ./.github/actions/pin-tsurlfilter-dev

      - name: Build dev extensions via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target dev-build-output \
            --output type=local,dest=output/dev-build .

      # Each *-dev.zip (chrome, chrome-mv3, edge, firefox-amo,
      # firefox-standalone, opera, opera-mv3) is uploaded as its own artifact
      # so QA can download only the browser they need.
      - name: Upload Chrome dev build
        uses: actions/upload-artifact@v7
        with:
          name: chrome-dev
          path: output/dev-build/artifacts/chrome-dev.zip
          if-no-files-found: error

      - name: Upload Chrome MV3 dev build
        uses: actions/upload-artifact@v7
        with:
          name: chrome-mv3-dev
          path: output/dev-build/artifacts/chrome-mv3-dev.zip
          if-no-files-found: error

      - name: Upload Edge dev build
        uses: actions/upload-artifact@v7
        with:
          name: edge-dev
          path: output/dev-build/artifacts/edge-dev.zip
          if-no-files-found: error

      - name: Upload Firefox AMO dev build
        uses: actions/upload-artifact@v7
        with:
          name: firefox-amo-dev
          path: output/dev-build/artifacts/firefox-amo-dev.zip
          if-no-files-found: error

      - name: Upload Firefox standalone dev build
        uses: actions/upload-artifact@v7
        with:
          name: firefox-standalone-dev
          path: output/dev-build/artifacts/firefox-standalone-dev.zip
          if-no-files-found: error

      - name: Upload Opera dev build
        uses: actions/upload-artifact@v7
        with:
          name: opera-dev
          path: output/dev-build/artifacts/opera-dev.zip
          if-no-files-found: error

      - name: Upload Opera MV3 dev build
        uses: actions/upload-artifact@v7
        with:
          name: opera-mv3-dev
          path: output/dev-build/artifacts/opera-mv3-dev.zip
          if-no-files-found: error

  chrome-crx:
    name: Chrome CRX (dev)
    runs-on: team-extensions
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pin tsurlfilter dev builds (if configured)
        uses: ./.github/actions/pin-tsurlfilter-dev

      - name: Build dev CRX via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target chrome-crx-output \
            --output type=local,dest=output/chrome-crx .

      - name: Upload dev CRX
        uses: actions/upload-artifact@v7
        with:
          name: chrome-dev-crx
          path: output/chrome-crx/artifacts/chrome-dev.crx
          if-no-files-found: error
          retention-days: 7

  integration-tests:
    name: Integration tests
    runs-on: team-extensions
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pin tsurlfilter dev builds (if configured)
        uses: ./.github/actions/pin-tsurlfilter-dev

      - name: Run integration tests via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --no-cache-filter=integration-tests-standalone \
            --target integration-tests-standalone-output \
            --output type=local,dest=output/integration-tests .

      - name: Upload integration tests report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-tests-report
          path: output/integration-tests/tests-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check integration tests exit code
        shell: bash
        run: bash tools/ci/check-exit-code.sh output/integration-tests/exit-code.txt "Integration tests"
