name: Publish release

# Builds the main channel artifacts, tags the release commit, deploys to
# static.adtidy.org, submits to browser stores, and creates the GitHub
# Release draft on the public repo (AdguardTeam/AdguardBrowserExtension).
#
# Triggered automatically by merging a release-bump/* PR opened by
# prepare-release.yml, or manually via workflow_dispatch.
# Beta tags (v5.6.0-beta.7) deploy only to beta channels; plain tags
# (v5.6.0) only to release channels. The 4-component build number
# (e.g. 5.6.0.7) lives in the manifest and the CHANGELOG heading only.
#
# Replaces Bamboo plans: build-beta, build-release,
# build-firefox-standalone-beta, build-firefox-amo-beta, deploy-beta,
# deploy-release, deploy-firefox-standalone-beta, deploy-firefox-amo-beta.

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to publish manually (defaults to the merged PR commit)
        required: false
        type: string

# Serialize all publishes for this repo: two release-bump PRs merged close
# together (or a merged PR racing a manual dispatch) would otherwise run in
# parallel and race on the same environments and store listings.
# An in-flight release is never cancelled.
concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.33.4
  NODE_VERSION: 22.17.0

jobs:
  resolve-version:
    # Publish only on manual dispatch or a merged release-bump/* PR from the
    # release bot (matched by immutable user id, so renames can't break it).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release-bump/') &&
       github.event.pull_request.user.id == fromJSON(vars.RELEASE_BOT_USER_ID || '285975488'))
    name: Resolve version
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      notes: ${{ steps.resolve.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The pnpm setup action is not in the organization Actions allowlist, so
      # the workflow was rejected at startup with zero jobs (AG-59355). Install
      # pnpm the same way the Dockerfile does (see AGENTS.md, "CI/CD (GitHub
      # Actions)"). `actions/setup-node` caching is not used: it resolves
      # `pnpm store path` before pnpm is installed.
      - name: Install pnpm
        run: npm install -g "pnpm@${PNPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Reads the first full-version heading (## [M.m.p.BUILD(-beta)]) from
      # CHANGELOG.md, verifies it matches package.json, and prints the semver
      # tag (vM.m.p or vM.m.p-beta.BUILD) and channel plus a notes= block into
      # $GITHUB_OUTPUT.
      - name: Resolve version from changelog
        id: resolve
        run: |
          set -euo pipefail
          pnpm tsx tools/release/resolve-version.ts >> "$GITHUB_OUTPUT"

  # Restores the Bamboo "Size and locales check": bundle-size and translation
  # validation gate every release before any build/upload happens. An oversize
  # or invalid bundle would otherwise surface only as a store rejection.
  preflight:
    name: Bundle size and locales check
    needs: resolve-version
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}

      # Fails the Docker build on size regressions (MV3 30MB / Firefox 4MB
      # stores limits) or invalid translations.
      - name: Check bundle size via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg BUILD_TYPE=beta \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target bundle-size-check-output \
            --output type=local,dest=output/bundle-size .

      - name: Validate locales via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target locales-check-output \
            --output type=local,dest=output/locales .

  build:
    name: Build extension artifacts
    needs: [resolve-version, preflight]
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # Vault JWT/OIDC for the CRX signing certificate (beta)
    outputs:
      channel: ${{ needs.resolve-version.outputs.channel }}
      approval-notes: ${{ steps.notes.outputs.approval-notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}

      # Only beta builds the CRX, and only beta needs the production
      # certificate. Release builds never touch the signing material.
      - name: Fetch CRX signing certificate from Vault
        id: vault-ext
        if: needs.resolve-version.outputs.channel == 'beta'
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          path: jwt
          role: extensions-private-browser-extension
          secrets: |
            secret/data/ci-secrets/extensions-private-browser-extension UNTRUSTED_certificate | CERTIFICATE_PEM ;

      # The certificate is passed to Docker as a BuildKit secret (--secret
      # id=CHROME_CERT) and is never written to the workspace or a build
      # context, so it cannot persist on the shared self-hosted runner.
      - name: Build beta artifacts via Docker
        if: needs.resolve-version.outputs.channel == 'beta'
        env:
          CERTIFICATE_PEM: ${{ steps.vault-ext.outputs.CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --secret id=CHROME_CERT,env=CERTIFICATE_PEM \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target beta-build-output \
            --output type=local,dest=output/build .
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --secret id=CHROME_CERT,env=CERTIFICATE_PEM \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target beta-chrome-crx-output \
            --output type=local,dest=output/crx .

      # archive-source.sh (inside the release-build stage) needs
      # gitignore-excludes.txt in the build context.
      - name: Generate find excludes
        if: needs.resolve-version.outputs.channel == 'release'
        run: ./tools/ci/generate-find-excludes.sh gitignore-excludes.txt

      - name: Build release artifacts via Docker
        if: needs.resolve-version.outputs.channel == 'release'
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target release-build-output \
            --output type=local,dest=output/build .

      # Lay out one artifact directory per deploy target. Names must match
      # exactly what each consumer expects:
      #   deploy-to-static.yml uploads every non-empty file in the artifact;
      #   deploy-to-chrome-web-store.yml expects chrome.zip;
      #   deploy-to-firefox-addons.yml expects firefox.zip + source.zip;
      #   deploy-to-edge-addons.yml expects edge.zip.
      - name: Stage deploy artifacts (beta)
        if: needs.resolve-version.outputs.channel == 'beta'
        run: |
          set -euo pipefail
          mkdir -p staged/static-chrome staged/static-edge staged/cws-mv3 staged/gh-assets
          cp output/build/artifacts/chrome.zip output/build/artifacts/chrome-mv3.zip \
             output/build/artifacts/build.txt staged/static-chrome/
          cp output/build/artifacts/edge-mv3.zip staged/static-edge/
          cp output/crx/artifacts/chrome.crx output/crx/artifacts/update.xml staged/static-chrome/
          cp output/build/artifacts/chrome-mv3.zip staged/cws-mv3/chrome.zip
          cp output/build/artifacts/chrome.zip output/build/artifacts/chrome-mv3.zip \
             output/build/artifacts/edge.zip output/build/artifacts/edge-mv3.zip output/build/artifacts/build.txt \
             output/crx/artifacts/chrome.crx staged/gh-assets/

      - name: Stage deploy artifacts (release)
        if: needs.resolve-version.outputs.channel == 'release'
        run: |
          set -euo pipefail
          mkdir -p staged/static-chrome staged/static-edge staged/static-firefox staged/cws-mv3 \
                   staged/amo staged/edge staged/gh-assets
          cp output/build/artifacts/chrome.zip output/build/artifacts/chrome-mv3.zip \
             output/build/artifacts/build.txt staged/static-chrome/
          cp output/build/artifacts/edge-mv3.zip staged/static-edge/
          cp output/build/artifacts/firefox.zip output/build/artifacts/build.txt staged/static-firefox/
          cp output/build/artifacts/chrome-mv3.zip staged/cws-mv3/chrome.zip
          cp output/build/artifacts/firefox.zip output/build/artifacts/source.zip \
             output/build/artifacts/approval-notes.txt staged/amo/
          cp output/build/artifacts/edge-mv3.zip staged/edge/edge.zip
          cp output/build/artifacts/chrome.zip output/build/artifacts/chrome-mv3.zip \
             output/build/artifacts/edge.zip output/build/artifacts/edge-mv3.zip output/build/artifacts/opera.zip \
             output/build/artifacts/opera-mv3.zip output/build/artifacts/firefox.zip \
             output/build/artifacts/build.txt staged/gh-assets/

      - name: Expose AMO approval notes (release)
        if: needs.resolve-version.outputs.channel == 'release'
        id: notes
        run: |
          {
            echo 'approval-notes<<__NOTES_EOF__'
            cat staged/amo/approval-notes.txt
            echo '__NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Upload static Chrome artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-chrome-${{ needs.resolve-version.outputs.channel }}
          path: staged/static-chrome/
          if-no-files-found: error
          retention-days: 7

      - name: Upload static Edge artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-edge-${{ needs.resolve-version.outputs.channel }}
          path: staged/static-edge/
          if-no-files-found: error
          retention-days: 7

      - name: Upload static Firefox artifact (release)
        if: needs.resolve-version.outputs.channel == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: static-firefox-release
          path: staged/static-firefox/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Chrome Web Store MV3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: cws-mv3-${{ needs.resolve-version.outputs.channel }}
          path: staged/cws-mv3/
          if-no-files-found: error
          retention-days: 7

      - name: Upload AMO artifact (release)
        if: needs.resolve-version.outputs.channel == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: amo-release
          path: staged/amo/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Edge artifact (release)
        if: needs.resolve-version.outputs.channel == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: edge-release
          path: staged/edge/
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Release assets
        uses: actions/upload-artifact@v7
        with:
          name: gh-assets-${{ needs.resolve-version.outputs.channel }}
          path: staged/gh-assets/
          if-no-files-found: error
          retention-days: 7

      # Defensive only: the signing certificate reaches Docker as a BuildKit
      # secret, so nothing should live under private/ on the shared runner.
      - name: Clean up signing certificate
        if: always()
        run: rm -rf private/

  tag:
    name: Create git tag
    needs: [resolve-version, preflight, build]
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: write   # push the git tag
      actions: write    # dispatch mirror.yml after tagging
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}

      # Create the tag only after the main build succeeds. If it already
      # exists at the release commit, a re-run continues without touching it.
      # If it exists at another commit, fail instead of moving it. A manual
      # retry must use the tag or its release commit, not a moved master.
      # The remote check is authoritative. Force only the local tag because a
      # previous attempt can leave it on the shared runner before a failed push.
      - name: Create git tag
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          EXISTING_TAG_SHA=$(git ls-remote --tags --refs origin "refs/tags/${TAG}" | awk '{print $1}')
          if [ -n "${EXISTING_TAG_SHA}" ]; then
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "${EXISTING_TAG_SHA}" != "${HEAD_SHA}" ]; then
              echo "::error::Tag ${TAG} already exists at ${EXISTING_TAG_SHA}, not at ${HEAD_SHA}. For a manual retry, dispatch on ${TAG} or ${EXISTING_TAG_SHA}. Otherwise bump the patch version instead of re-releasing ${TAG}. Tags are never force-moved."
              exit 1
            fi
            echo "Tag ${TAG} already points to the release commit; keeping it as is."
          else
            git tag -f "${TAG}"
            git push origin "${TAG}"
          fi

      # A tag pushed with GITHUB_TOKEN does not start workflow runs, so
      # mirror.yml's `push: tags` trigger never fires for release tags.
      # Dispatch it explicitly; it mirrors master and all v* tags, including
      # the tag pushed above.
      - name: Dispatch mirror workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mirror.yml --repo "${GITHUB_REPOSITORY}"

  build-firefox-standalone:
    # Firefox standalone beta is signed by Mozilla via go-webext. Kept in an
    # isolated job (signing can take up to ~20 minutes) so it never blocks
    # the Chromium path.
    name: Build and sign Firefox standalone (beta)
    needs: [resolve-version, preflight]
    if: needs.resolve-version.outputs.channel == 'beta'
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # Vault JWT/OIDC for AMO signing credentials
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}

      - name: Generate find excludes
        run: ./tools/ci/generate-find-excludes.sh gitignore-excludes.txt

      - name: Build Firefox standalone via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target firefox-beta-build-output \
            --output type=local,dest=output/ff-build .

      - name: Fetch Firefox AMO credentials from Vault
        id: vault-amo
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          path: jwt
          role: firefox-amo-deployer
          secrets: |
            secret/data/ci-secrets/firefox-amo-deployer client-id | FIREFOX_CLIENT_ID ;
            secret/data/ci-secrets/firefox-amo-deployer client-secret | FIREFOX_CLIENT_SECRET ;

      - name: Sign Firefox XPI via Docker
        env:
          FIREFOX_CLIENT_ID: ${{ steps.vault-amo.outputs.FIREFOX_CLIENT_ID }}
          FIREFOX_CLIENT_SECRET: ${{ steps.vault-amo.outputs.FIREFOX_CLIENT_SECRET }}
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-context firefox-artifacts=output/ff-build/artifacts \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --secret id=FIREFOX_CLIENT_ID,env=FIREFOX_CLIENT_ID \
            --secret id=FIREFOX_CLIENT_SECRET,env=FIREFOX_CLIENT_SECRET \
            --target firefox-beta-sign-output \
            --output type=local,dest=output/ff-sign .

      - name: Stage Firefox artifacts
        run: |
          set -euo pipefail
          mkdir -p staged/static-firefox staged/gh-assets-firefox
          cp output/ff-sign/artifacts/firefox.zip output/ff-sign/artifacts/firefox.xpi \
             output/ff-sign/artifacts/update.json output/ff-sign/artifacts/build.txt \
             staged/static-firefox/
          cp output/ff-sign/artifacts/firefox.zip output/ff-sign/artifacts/firefox.xpi \
             output/ff-sign/artifacts/build.txt staged/gh-assets-firefox/

      - name: Upload static Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-firefox-beta
          path: staged/static-firefox/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Firefox release assets
        uses: actions/upload-artifact@v7
        with:
          name: gh-assets-firefox-beta
          path: staged/gh-assets-firefox/
          if-no-files-found: error
          retention-days: 7

  build-firefox-amo-beta:
    # Unsigned AMO beta upload package (AMO signs it during review).
    name: Build Firefox AMO beta
    needs: [resolve-version, preflight]
    if: needs.resolve-version.outputs.channel == 'beta'
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      approval-notes: ${{ steps.notes.outputs.approval-notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}

      - name: Generate find excludes
        run: ./tools/ci/generate-find-excludes.sh gitignore-excludes.txt

      - name: Build Firefox AMO beta via Docker
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --build-arg TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target firefox-amo-beta-build-output \
            --output type=local,dest=output/ff-amo .

      # deploy-to-firefox-addons.yml requires the extension to be named
      # firefox.zip inside the artifact.
      - name: Stage AMO beta artifact
        run: |
          set -euo pipefail
          mkdir -p staged/amo-beta
          cp output/ff-amo/artifacts/firefox-amo.zip staged/amo-beta/firefox.zip
          cp output/ff-amo/artifacts/source.zip output/ff-amo/artifacts/approval-notes.txt \
             staged/amo-beta/

      - name: Expose AMO approval notes
        id: notes
        run: |
          {
            echo 'approval-notes<<__NOTES_EOF__'
            cat staged/amo-beta/approval-notes.txt
            echo '__NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Upload AMO beta artifact
        uses: actions/upload-artifact@v7
        with:
          name: amo-beta
          path: staged/amo-beta/
          if-no-files-found: error
          retention-days: 7

  deploy-static-chrome:
    name: Deploy Chrome to static.adtidy.org
    needs: [resolve-version, tag, build]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-static.yml@master
    with:
      team: extensions
      deployer-module: adblocker-webext-chrome-${{ needs.build.outputs.channel }}
      artifact-name: static-chrome-${{ needs.build.outputs.channel }}
      environment: ${{ needs.build.outputs.channel == 'beta' && 'beta-static' || 'production-static' }}
    permissions:
      contents: read
      id-token: write   # OIDC token for authenticated Deployer upload

  deploy-static-edge:
    name: Deploy Edge to static.adtidy.org
    needs: [resolve-version, tag, build]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-static.yml@master
    with:
      team: extensions
      deployer-module: adblocker-webext-edge-${{ needs.build.outputs.channel }}
      artifact-name: static-edge-${{ needs.build.outputs.channel }}
      environment: ${{ needs.build.outputs.channel == 'beta' && 'beta-static' || 'production-static' }}
    permissions:
      contents: read
      id-token: write

  deploy-static-firefox-beta:
    name: Deploy Firefox beta to static.adtidy.org
    needs: [resolve-version, tag, build-firefox-standalone]
    if: needs.resolve-version.outputs.channel == 'beta'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-static.yml@master
    with:
      team: extensions
      deployer-module: adblocker-webext-firefox-beta
      artifact-name: static-firefox-beta
      environment: beta-static
    permissions:
      contents: read
      id-token: write

  deploy-static-firefox-release:
    name: Deploy Firefox release to static.adtidy.org
    needs: [resolve-version, tag, build]
    if: needs.resolve-version.outputs.channel == 'release'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-static.yml@master
    with:
      team: extensions
      deployer-module: adblocker-webext-firefox-release
      artifact-name: static-firefox-release
      environment: production-static
    permissions:
      contents: read
      id-token: write

  publish-cws-mv3-beta:
    name: Publish MV3 beta to Chrome Web Store
    needs: [resolve-version, tag, build]
    if: needs.resolve-version.outputs.channel == 'beta'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-chrome-web-store.yml@master
    with:
      team: extensions
      environment: chrome-webstore-beta
      artifact-name: cws-mv3-beta
      item-id: ${{ vars.CHROME_WEBSTORE_MV3_BETA_ITEM_ID || 'apjcbfpjihpedihablmalmbbhjpklbdf' }}
      api-version: v2
      slack-channel: ''
      product: AdGuard Browser Extension MV3 Beta
      version-title: ${{ needs.resolve-version.outputs.tag }}
    permissions:
      contents: read
      id-token: write

  publish-cws-mv3-release:
    name: Publish MV3 release to Chrome Web Store
    needs: [resolve-version, tag, build]
    if: needs.resolve-version.outputs.channel == 'release'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-chrome-web-store.yml@master
    with:
      team: extensions
      environment: chrome-webstore-release
      artifact-name: cws-mv3-release
      item-id: ${{ vars.CHROME_WEBSTORE_MV3_ITEM_ID || 'bgnkhhnnamicmpeenaelnjfhikgbkllg' }}
      api-version: v2
      slack-channel: ''
      product: AdGuard Browser Extension MV3
      version-title: ${{ needs.resolve-version.outputs.tag }}
    permissions:
      contents: read
      id-token: write

  publish-amo-release:
    name: Publish release to Firefox AMO
    needs: [resolve-version, tag, build]
    if: needs.resolve-version.outputs.channel == 'release'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-firefox-addons.yml@master
    with:
      team: extensions
      environment: firefox-amo-release
      artifact-name: amo-release
      channel-type: listed
      approval-notes: ${{ needs.build.outputs.approval-notes }}
      slack-channel: ''
      product: AdGuard AdBlocker
      version-title: ${{ needs.resolve-version.outputs.tag }}
      listing-url: https://addons.mozilla.org/firefox/addon/adguard-adblocker/
    permissions:
      contents: read
      id-token: write

  publish-amo-beta:
    name: Publish beta to Firefox AMO
    needs: [resolve-version, tag, build-firefox-amo-beta]
    if: needs.resolve-version.outputs.channel == 'beta'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-firefox-addons.yml@master
    with:
      team: extensions
      environment: firefox-amo-beta
      artifact-name: amo-beta
      channel-type: listed
      approval-notes: ${{ needs.build-firefox-amo-beta.outputs.approval-notes }}
      slack-channel: ''
      product: AdGuard AdBlocker Beta
      version-title: ${{ needs.resolve-version.outputs.tag }}
      listing-url: https://addons.mozilla.org/firefox/addon/adguard-adblocker/
    permissions:
      contents: read
      id-token: write

  publish-edge-release:
    name: Upload release draft to Edge Add-ons
    needs: [resolve-version, tag, build]
    if: needs.resolve-version.outputs.channel == 'release'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-edge-addons.yml@master
    with:
      team: extensions
      environment: edge-addons-release
      artifact-name: edge-release
      product-id: ${{ vars.EDGE_ADDONS_PRODUCT_ID }}
      # The scheduled auto-build is the only job that submits to Edge. Manual
      # releases only upload the new version as a draft, so it can be reviewed
      # and submitted from Partner Center after QA.
      publish: false
      slack-channel: ''
      product: AdGuard AdBlocker
      version-title: ${{ needs.resolve-version.outputs.tag }}
    permissions:
      contents: read
      id-token: write

  # Opera has no public store API — opera zips ship only as GitHub Release
  # assets (same as Bamboo; store submission stays manual).

  create-release:
    name: Create GitHub Release draft (public repo)
    needs: [resolve-version, tag, build]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/create-gh-release.yml@master
    with:
      team: extensions
      target_repo: AdguardTeam/AdguardBrowserExtension
      tag_name: ${{ needs.resolve-version.outputs.tag }}
      body: ${{ needs.resolve-version.outputs.notes }}
      artifact_name: gh-assets-${{ needs.build.outputs.channel }}
      draft: true
      prerelease: ${{ needs.build.outputs.channel == 'beta' }}
    permissions:
      contents: read
      id-token: write   # Octopass OIDC for the cross-repo token

  attach-firefox-assets-beta:
    # Firefox beta assets are signed via AMO in an isolated job; attach them
    # to the existing draft (same tag) without publishing it.
    name: Attach Firefox assets to GitHub Release (beta)
    needs: [resolve-version, build-firefox-standalone, create-release]
    if: needs.resolve-version.outputs.channel == 'beta'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/create-gh-release.yml@master
    with:
      team: extensions
      target_repo: AdguardTeam/AdguardBrowserExtension
      tag_name: ${{ needs.resolve-version.outputs.tag }}
      body: ${{ needs.resolve-version.outputs.notes }}
      artifact_name: gh-assets-firefox-beta
      draft: true
      prerelease: true
    permissions:
      contents: read
      id-token: write

  notify-success:
    name: Notify (success)
    needs: [resolve-version, tag, preflight, build, build-firefox-standalone, build-firefox-amo-beta, deploy-static-chrome, deploy-static-edge, deploy-static-firefox-beta, deploy-static-firefox-release, publish-cws-mv3-beta, publish-cws-mv3-release, publish-amo-release, publish-amo-beta, publish-edge-release, create-release, attach-firefox-assets-beta]
    # Skipped channel-specific jobs count as success; any failure or
    # cancellation switches to the failure notification.
    if: >-
      always() &&
      needs.resolve-version.result == 'success' &&
      needs.tag.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: team-extensions
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: '#adguard-extension-vcs'
          message: ':white_check_mark: *browser-extension* *${{ needs.resolve-version.outputs.tag }}* (${{ needs.resolve-version.outputs.channel }}) deployed to static.adtidy.org + stores; GitHub Release draft ready for manual publication — <${{ needs.create-release.outputs.release-url }}|draft> | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>'
          color: good

  notify-failure:
    name: Notify (failure)
    needs: [resolve-version, tag, preflight, build, build-firefox-standalone, build-firefox-amo-beta, deploy-static-chrome, deploy-static-edge, deploy-static-firefox-beta, deploy-static-firefox-release, publish-cws-mv3-beta, publish-cws-mv3-release, publish-amo-release, publish-amo-beta, publish-edge-release, create-release, attach-firefox-assets-beta]
    # resolve-version must succeed so we have a tag to report; build jobs are
    # included so a build failure is never hidden behind "deploy: skipped".
    # Cancellation (manual cancel or a lost runner) is reported too so a
    # cancelled publish is never silent.
    if: >-
      always() &&
      needs.resolve-version.result == 'success' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: team-extensions
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: '#adguard-extension-vcs'
          message: ':cross-mark: *browser-extension* *${{ needs.resolve-version.outputs.tag }}* deploy failed (preflight: ${{ needs.preflight.result }}, tag: ${{ needs.tag.result }}, build: ${{ needs.build.result }}, build-ff: ${{ needs.build-firefox-standalone.result }}, build-ff-amo: ${{ needs.build-firefox-amo-beta.result }}, static-chrome: ${{ needs.deploy-static-chrome.result }}, static-edge: ${{ needs.deploy-static-edge.result }}, static-ff-beta: ${{ needs.deploy-static-firefox-beta.result }}, static-ff-release: ${{ needs.deploy-static-firefox-release.result }}, cws-mv3-beta: ${{ needs.publish-cws-mv3-beta.result }}, cws-mv3-release: ${{ needs.publish-cws-mv3-release.result }}, amo-release: ${{ needs.publish-amo-release.result }}, amo-beta: ${{ needs.publish-amo-beta.result }}, edge: ${{ needs.publish-edge-release.result }}, gh-release: ${{ needs.create-release.result }}, ff-assets: ${{ needs.attach-firefox-assets-beta.result }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>'
          color: danger

  notify-resolve-failure:
    name: Notify (resolve failure)
    needs: [resolve-version]
    if: >-
      always() &&
      (needs.resolve-version.result == 'failure' || needs.resolve-version.result == 'cancelled')
    runs-on: team-extensions
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: '#adguard-extension-vcs'
          message: ':cross-mark: *browser-extension* release failed at resolve-version (result: ${{ needs.resolve-version.result }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>'
          color: danger
