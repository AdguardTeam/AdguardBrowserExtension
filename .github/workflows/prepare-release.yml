name: Prepare release

# Opens a release-bump PR that sets package.json to the requested version and
# finalizes CHANGELOG.md. After the PR is merged, publish-release.yml takes
# over. The tag is semver: "-beta.N" (e.g. v5.6.0-beta.7) deploys only to the
# beta channel; no suffix (e.g. v5.6.0) deploys only to the release channel.
# The 4-component build number (e.g. 5.6.0.7) is allocated from package.json
# unless an explicit higher override is supplied. It stays in the manifest and
# the CHANGELOG heading only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Semver release tag WITH "v" prefix.
          "-beta.N" suffix = beta channel only (e.g. v5.6.0-beta.7;
          N must equal the allocated build number).
          No suffix = release channel only (e.g. v5.6.0).
        required: true
        type: string
      build:
        description: >-
          Optional manifest build number. If a stable branch has a higher
          counter than master, choose a value greater than both counters.
          It must be greater than the current package.json build.
          For a beta, it must equal N in the tag.
        required: false
        type: string

# `contents: write` — push the release-bump branch
# `id-token: write` — Octopass OIDC for PR creation and protected-push
permissions:
  contents: write
  id-token: write

env:
  PNPM_VERSION: 10.33.4
  NODE_VERSION: 22.17.0

# The force-with-lease push of the release-bump branch (via protected-push)
# must not interleave with a concurrent run for the same tag.
concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Create release PR
    runs-on: team-extensions
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Don't persist the default GITHUB_TOKEN as a git credential: the
          # protected-push step below authenticates with an Octopass-issued
          # token, and a persisted http.extraheader would collide with the one
          # protected-push sets, making git send two Authorization headers
          # which GitHub rejects with HTTP 400 "Duplicate header:
          # Authorization". The branch bootstrap below passes the workflow
          # token explicitly instead.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The pnpm setup action is not in the organization Actions allowlist, so
      # the workflow would be rejected at startup with zero jobs (AG-59355).
      # Install pnpm the same way the Dockerfile does (see AGENTS.md, "CI/CD
      # (GitHub Actions)"). `actions/setup-node` caching is not used: it resolves
      # `pnpm store path` before pnpm is installed.
      - name: Install pnpm
        run: npm install -g "pnpm@${PNPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Checks that the requested tag and, for a beta, its plain release tag do
      # not exist on origin. Allocates the build number, sets package.json to
      # M.m.p+BUILD.build.<dnrPatch>, and patches CHANGELOG.md.
      # The inputs are passed via env to avoid interpolating them into the
      # shell command. The temporary git configuration authenticates the
      # remote-tag checks because checkout does not persist credentials.
      - name: Bump version and changelog
        env:
          TAG: ${{ inputs.tag }}
          BUILD: ${{ inputs.build }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="${AUTH_HEADER}"
          pnpm tsx tools/release/prepare-release.ts "${TAG}" "${BUILD}"

      # Create the local branch carrying the (still uncommitted) bump changes.
      - name: Create release-bump branch
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          BRANCH="release-bump/${TAG}"
          git checkout -b "${BRANCH}"

      # protected-push requires the remote branch to exist before it can push
      # with --force-with-lease; create it on the first run only. Re-runs of
      # the same tag are safe: protected-push resets the branch against the
      # live remote head.
      - name: Ensure remote release-bump branch exists
        env:
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="release-bump/${TAG}"
          # checkout no longer persists credentials (see the Checkout step),
          # so pass the workflow token to these git commands explicitly.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          if ! git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin "HEAD:${BRANCH}"
          fi

      # Commits package.json + CHANGELOG.md and pushes the branch with the
      # company-shared protected-push action (Octopass token + force-with-lease
      # safety) instead of a hand-rolled delete-then-push.
      - name: Push release-bump branch
        uses: AdGuardSoftwareLimited/actions/actions/protected-push@master
        with:
          # Required: protected-push forwards this to Octopass as the target
          # repository for the minted token. Without it, Octopass gets an empty
          # repository and rejects the request ("invalid token scope request").
          repository: ${{ github.repository }}
          branch: release-bump/${{ inputs.tag }}
          commit-message: Release ${{ inputs.tag }}
          files: package.json CHANGELOG.md

      - name: Create pull request
        uses: AdGuardSoftwareLimited/actions/actions/create-pr@master
        with:
          title: 'Release ${{ inputs.tag }}'
          body: "Release ${{ inputs.tag }}\n\nMerging this PR triggers the publish-release workflow."
          head: 'release-bump/${{ inputs.tag }}'
          base: master
